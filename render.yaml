services:
  - type: web
    name: personality-quest
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: personality-quest-data
      mountPath: /var/data
      sizeGB: 1
